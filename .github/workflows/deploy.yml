name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: deploy blog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4
    - name: Install libvips-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libvips-tools
    - name: Optimise images with vipsthumbnail
      run: |
        find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 |
        while IFS= read -r -d '' f; do
          case "$f" in
            *.[pP][nN][gG]) opts="[strip]" ;;
            *) opts="[Q=80,optimize_coding,interlace,strip]" ;;
          esac
          base="${f##*/}"
          dir="${f%/*}"
          vipsthumbnail "$f" --size "1400x1400>" -o "tmp-vips-$base$opts"
          mv "$dir/tmp-vips-$base" "$f"
        done
    - name: deploy to skoji
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        PORT: ${{ secrets.DEPLOY_PORT }}
        TZ: 'Asia/Tokyo'
      run: |
        eval `ssh-agent -s`
        echo "${DEPLOY_KEY}" > keyfile && chmod 600 keyfile
        ssh-add keyfile
        bundle install
        bundle exec rake build
        rsync -e "ssh -o StrictHostKeyChecking=no -p ${PORT}" -r -vz skoji.jp-root/ web-deploy@skoji.jp:/var/www/html/
        
        
      
